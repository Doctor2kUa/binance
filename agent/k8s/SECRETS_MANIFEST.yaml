# ═══ REGISTRY SECRET ═══
# Создать GHCR token (GitHub → Settings → Tokens → Fine-grained)
# с правами: read:packages ( scopes: read:packages )
# Затем создать секрет:
#
# kubectl create secret docker-registry ghcr-watchlist-agent \
#   --docker-server=ghcr.io \
#   --docker-username=YOUR_GITHUB_USERNAME \
#   --docker-password=YOUR_GITHUB_TOKEN \
#   --namespace=function
#
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-watchlist-agent
  namespace: function
type: kubernetes.io/dockerconfigjson
# .dockerconfigjson: <base64 encoded>
# Ты добавишь сам через kubectl create secret docker-registry

---
# ═══ AGENT SECRETS (Telegram + OpenRouter) ═══
# Добавь свой ключ в GitHub Secrets репозитория для CI/CD
# И примени в кластер:
#
# kubectl create secret generic binance-watchlist-secrets \
#   --from-literal=OPENROUTER_API_KEY=sk-or-v1-XXXX \
#   --from-literal=BOT_TOKEN=XXXXXXXXXX \
#   --from-literal=CHAT_ID=XXXXXXXX \
#   --namespace=function
#
apiVersion: v1
kind: Secret
metadata:
  name: binance-watchlist-secrets
  namespace: function
type: Opaque
# OPENROUTER_API_KEY: <base64>
# BOT_TOKEN: <base64>
# CHAT_ID: <base64>

---
# ═══ ИНСТРУКЦИЯ ═══
# 1. GHCR: в настройках GitHub repo binance → Secrets → Actions →
#    добавить GHCR_TOKEN (или используй GITHUB_TOKEN — он уже есть)
#
# 2. K8s image pull secret:
#    kubectl create secret docker-registry ghcr-watchlist-agent \
#      --docker-server=ghcr.io \
#      --docker-username=Doctor2kUa \
#      --docker-password=<GITHUB_TOKEN_WITH_READ_PACKAGES> \
#      --namespace=function
#
# 3. Agent runtime secrets:
#    kubectl create secret generic binance-watchlist-secrets \
#      --from-literal=OPENROUTER_API_KEY=sk-or-v1-... \
#      --from-literal=BOT_TOKEN=8170...:AA... \
#      --from-literal=CHAT_ID=-100... \
#      --namespace=function
#
