apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: binance-watchlist-agent
  namespace: function
  labels:
    app: binance-watchlist-agent
spec:
  template:
    metadata:
      labels:
        app: binance-watchlist-agent
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        autoscaling.knative.dev/targetConcurrency: "5"
        networking.knative.dev/visibility: cluster-local
    spec:
      containerConcurrency: 10
      timeoutSeconds: 60
      containers:
        - name: agent
          image: registry.digitalocean.com/gart-tech-core-registry/binance-watchlist-agent:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "8000"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: binance-watchlist-secrets
                  key: OPENROUTER_API_KEY
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: binance-watchlist-secrets
                  key: BOT_TOKEN
            - name: CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: binance-watchlist-secrets
                  key: CHAT_ID
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: binance-watchlist-secrets
                  key: API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
