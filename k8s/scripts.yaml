apiVersion: v1
kind: ConfigMap
metadata:
  name: binance-scripts
  namespace: function
data:
  # ═══ СКРИПТЫ ═══
  # monitor-urgent: 5 min — TP/SL hit, critical SL proximity, errors
  # monitor-hourly: 1h — warnings, 24h moves, position updates

  common.py: |
    """Shared utilities."""
    import urllib.request, json, os

    BASE = "https://fapi.binance.com"
    CONFIG_PATH = "/config/positions.json"

    def api(url):
        req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
        return json.loads(urllib.request.urlopen(req, timeout=15).read())

    def load_config():
        with open(CONFIG_PATH) as f:
            return json.load(f)

    def send_telegram(msg):
        token = os.environ["BOT_TOKEN"]
        chat_id = os.environ["CHAT_ID"]
        url = f"https://api.telegram.org/bot{token}/sendMessage"
        data = json.dumps({"chat_id": chat_id, "text": msg}).encode()
        req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
        resp = json.loads(urllib.request.urlopen(req, timeout=10).read())
        if not resp.get("ok"):
            print(f"Telegram error: {resp}")

    def F(v):
        return "$%.4f" % v if v < 1 else "$%.2f" % v

    def P(v):
        return "%+.1f%%" % v

    def dist(cur, tgt):
        return "(%+.0f%%)" % ((tgt/cur-1)*100)

    def get_price(sym):
        t = api(f"{BASE}/fapi/v1/ticker/24hr?symbol={sym}")
        return float(t['lastPrice']), float(t['priceChangePercent'])

    def get_1h_change(sym):
        """Получает изменение цены за 1 час из 1ч свечей. Возвращает float %."""
        try:
            kl = api(f"{BASE}/fapi/v1/klines?symbol={sym}&interval=1h&limit=2")
            if len(kl) >= 2:
                open_1h_ago = float(kl[0][1])  # open первой свечи
                now = float(kl[-1][4])  # close последней свечи
                return (now / open_1h_ago - 1) * 100
        except Exception:
            pass
        return 0.0

    def calc_pnl(side, lev, entry, px):
        if side.upper() == "LONG":
            return (px / entry - 1) * 100 * lev
        else:
            return (entry / px - 1) * 100 * lev

  monitor_urgent.py: |
    """URGENT monitor — runs every 5 min.
    Sends ONLY critical alerts:
    - TP/SL hit
    - SL within danger zone (< 3%)
    - Big adverse move (> 8% against position)
    - Errors fetching data
    """
    import sys; sys.path.insert(0, "/scripts")
    from common import *
    from datetime import datetime

    config = load_config()
    positions = [p for p in config["positions"] if p.get("status") == "OPEN"]
    settings = config.get("settings", {}).get("monitor", {})
    sl_danger = settings.get("sl_danger_pct", 3)
    big_move = settings.get("big_move_pct", 8)

    alerts = []

    for p in positions:
        sym = p["symbol"]
        name = sym.replace("USDT", "")
        side = p["side"]
        lev = p.get("leverage", 2)
        entry = p["entry_price"]
        sl = p["sl"]
        tp1 = p.get("tp1", 0)
        tp2 = p.get("tp2", 0)
        tp3 = p.get("tp3", 0)

        try:
            px, ch = get_price(sym)
            pnl = calc_pnl(side, lev, entry, px)
            to_sl = abs((sl / px - 1) * 100)

            # TP/SL HIT — always alert
            hit = False
            if side.upper() == "LONG":
                if tp3 and px >= tp3:
                    alerts.append(f"TP3 HIT {name} {F(px)} — close ALL. PnL {P(pnl)}")
                    hit = True
                elif tp2 and px >= tp2:
                    alerts.append(f"TP2 HIT {name} {F(px)} — close 50%. PnL {P(pnl)}")
                    hit = True
                elif tp1 and px >= tp1:
                    alerts.append(f"TP1 HIT {name} {F(px)} — close 30%, SL→entry. PnL {P(pnl)}")
                    hit = True
                if px <= sl:
                    alerts.append(f"🔴 SL HIT {name} {F(px)} — CLOSE! PnL {P(pnl)}")
                    hit = True
            elif side.upper() == "SHORT":
                if tp3 and px <= tp3:
                    alerts.append(f"TP3 HIT {name} {F(px)} — close ALL. PnL {P(pnl)}")
                    hit = True
                elif tp2 and px <= tp2:
                    alerts.append(f"TP2 HIT {name} {F(px)} — close 50%. PnL {P(pnl)}")
                    hit = True
                elif tp1 and px <= tp1:
                    alerts.append(f"TP1 HIT {name} {F(px)} — close 30%, SL→entry. PnL {P(pnl)}")
                    hit = True
                if px >= sl:
                    alerts.append(f"🔴 SL HIT {name} {F(px)} — CLOSE! PnL {P(pnl)}")
                    hit = True

            if hit:
                continue

            # SL DANGER ZONE (< 3%)
            if to_sl < sl_danger:
                alerts.append(f"🔴 {name} {F(px)} — {to_sl:.1f}% to SL! PnL {P(pnl)}")
                continue

            # Big adverse move (> 10% in 1h against position)
            # Only check SL DANGER first
            if to_sl >= sl_danger:
                ch_1h = get_1h_change(sym)
                if side.upper() == "LONG" and ch_1h <= -10:
                    alerts.append(f"🔴 {name} {F(px)} — down {P(ch_1h)} 1h! PnL {P(pnl)}")
                elif side.upper() == "SHORT" and ch_1h >= 10:
                    alerts.append(f"🔴 {name} {F(px)} — up {P(ch_1h)} 1h! PnL {P(pnl)}")

        except Exception as e:
            alerts.append(f"⚠️ {name} error: {e}")

    now = datetime.utcnow().strftime('%H:%M')

    if alerts:
        msg = f"🚨 URGENT {now}\n\n" + "\n".join(alerts)
        if len(msg) > 4000:
            msg = msg[:3950] + "\ntruncated..."
        send_telegram(msg)
        print(f"ALERT sent: {len(alerts)} alerts")
    else:
        print("OK - no urgent alerts")

  monitor_hourly.py: |
    """HOURLY monitor — runs every 1h.
    Sends warnings and position updates:
    - SL proximity warning (3-5%)
    - 24h price moves (> 5%)
    - Position PnL updates
    - Big moves on watchlist
    """
    import sys; sys.path.insert(0, "/scripts")
    from common import *
    from datetime import datetime

    config = load_config()
    positions = [p for p in config["positions"] if p.get("status") == "OPEN"]
    watchlist = config.get("watchlist", [])
    settings = config.get("settings", {}).get("monitor", {})
    sl_warn = settings.get("sl_warning_pct", 5)
    big_move = settings.get("big_move_pct", 5)

    warnings = []
    pos_updates = []
    wl_updates = []

    # POSITIONS — warnings and updates
    for p in positions:
        sym = p["symbol"]
        name = sym.replace("USDT", "")
        side = p["side"]
        lev = p.get("leverage", 2)
        entry = p["entry_price"]
        amount = p.get("amount_usdt", 0)
        sl = p["sl"]
        tp1 = p.get("tp1", 0)
        tp2 = p.get("tp2", 0)
        tp3 = p.get("tp3", 0)

        try:
            px, ch = get_price(sym)
            pnl = calc_pnl(side, lev, entry, px)
            to_sl = abs((sl / px - 1) * 100)

            # Position update
            pnl_s = "+%.1f%%" % pnl if pnl >= 0 else "%.1f%%" % pnl
            emoji = "🟢" if pnl >= 0 else "🔴"
            pos_updates.append(f"{emoji} {name} {side} {lev}x  {F(px)} ({P(ch)})  {pnl_s}")

            # SL proximity warning (3-5%)
            if sl_warn <= to_sl < 3:
                pass  # handled by urgent
            elif 3 <= to_sl < sl_warn:
                warnings.append(f"🟡 {name} {F(px)} — {to_sl:.1f}% to SL")
            elif to_sl < 3:
                warnings.append(f"🔴 {name} {F(px)} — {to_sl:.1f}% to SL!")

            # 24h move warning
            if abs(ch) >= big_move:
                arrow = "🔴" if (ch < 0 and side.upper() == "LONG") or (ch > 0 and side.upper() == "SHORT") else "🟢"
                warnings.append(f"{arrow} {name} {F(px)} — {P(ch)} 24h")

        except Exception as e:
            warnings.append(f"⚠️ {name} error: {e}")

    # WATCHLIST — big moves
    if watchlist:
        for w in watchlist:
            sym = w["symbol"]
            name = sym.replace("USDT", "")
            try:
                px, ch = get_price(sym)
                if abs(ch) >= 5:
                    arrow = "🔴" if ch < 0 else "🟢"
                    wl_updates.append(f"{arrow} {name} {F(px)} — {P(ch)} 24h")
            except Exception:
                pass

    now = datetime.utcnow().strftime('%H:%M')
    sections = []

    if pos_updates:
        sections.append("POSITIONS\n" + "\n".join(pos_updates))

    if warnings:
        sections.append("WARNINGS\n" + "\n".join(warnings))

    if wl_updates:
        sections.append("WATCHLIST\n" + "\n".join(wl_updates))

    if sections:
        msg = f"📊 HOURLY {now}\n\n" + "\n\n".join(sections)
        if len(msg) > 4000:
            msg = msg[:3950] + "\ntruncated..."
        send_telegram(msg)
        print(f"REPORT sent: {len(pos_updates)} positions, {len(warnings)} warnings, {len(wl_updates)} wl")
    else:
        print("OK - no warnings")

  send_report.py: |
    """Full report: positions + watchlist. Runs every 2h."""
    import sys; sys.path.insert(0, "/scripts")
    from common import *
    from datetime import datetime

    config = load_config()
    positions = [p for p in config["positions"] if p.get("status") == "OPEN"]
    watchlist = config.get("watchlist", [])

    now = datetime.utcnow().strftime('%d.%m %H:%M UTC')
    o = []
    o.append(f"*Binance Report*  {now}")
    o.append("")

    # POSITIONS
    if positions:
        o.append("*POSITIONS*")
        o.append("")
        for p in positions:
            sym = p["symbol"]
            name = sym.replace("USDT", "")
            side = p["side"]
            lev = p.get("leverage", 2)
            entry = p["entry_price"]
            amount = p.get("amount_usdt", 0)
            sl, tp1, tp2, tp3 = p["sl"], p.get("tp1",0), p.get("tp2",0), p.get("tp3",0)
            try:
                px, ch = get_price(sym)
                pnl = calc_pnl(side, lev, entry, px)
                pnl_s = "+%.1f" % pnl if pnl >= 0 else "%.1f" % pnl
                emoji = "🟢" if pnl >= 0 else "🔴"
                to_sl = abs((sl / px - 1) * 100)
                o.append("*%s* %s %sx  %s (%s) %s %s" % (name, side, lev, F(px), P(ch), emoji, pnl_s+"%"))
                o.append("`  entry %s  amt $%d" % (F(entry), amount))
                levels = []
                if tp1: levels.append("TP1 %s %s" % (F(tp1), dist(px, tp1)))
                if tp2: levels.append("TP2 %s %s" % (F(tp2), dist(px, tp2)))
                if tp3: levels.append("TP3 %s" % F(tp3))
                o.append("  %s  SL %s %s" % (" / ".join(levels), F(sl), dist(px, sl)))
                if to_sl < 3: o.append("  🔴 SL CRITICAL (%.1f%%)" % to_sl)
                elif to_sl < 5: o.append("  ⚠️ SL close (%.1f%%)" % to_sl)
                o.append("")
            except Exception as e:
                o.append("%s: %s\n" % (name, e))
    else:
        o.append("*POSITIONS* — none\n")

    # WATCHLIST
    if watchlist:
        o.append("*WATCHLIST*")
        o.append("")
        for w in watchlist:
            sym = w["symbol"]
            name = sym.replace("USDT", "")
            try:
                px, ch = get_price(sym)
                o.append("*%s*  %s  %s (%s)" % (name, w.get("direction",""), F(px), P(ch)))
                if w.get("entry_zone"): o.append("  in: %s" % w["entry_zone"])
                if w.get("sl"): o.append("  SL %s" % F(w["sl"]))
                if w.get("tp1"): o.append("  TP1 %s" % F(w["tp1"]))
                if w.get("tp2"): o.append("  TP2 %s" % F(w["tp2"]))
                if w.get("note"): o.append("  > %s" % w["note"])
                o.append("")
            except Exception as e:
                o.append("%s: %s\n" % (name, e))

    o.append("_next in 2h_")
    msg = "\n".join(o)
    if len(msg) > 4000: msg = msg[:3950] + "\ntruncated..."
    send_telegram(msg)
    print("Sent")
